<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/felino.js" defer></script>
    <title>Jogo dos felinos</title>
        
</head>
<body>

    <div id="container">

        <div class="coluna">
            <img src="Imagens/gato01.gif" id="gato1">
            <p>Clique em mim!</p>
        </div>

        <div class="coluna">
            <img src="Imagens/gato02.gif" id="gato2">
            <p>Clique sobre mim várias vezes!</p>
            <p>Carinhos: <span id="contador">0</span></p>
        </div>

        <div class="coluna">
            <img src="Imagens/gato03.gif" id="gato3">
            <p>Passe o cursor do mouse sobre mim!</p>
        </div>

        <div class="coluna">
            <img src="Imagens/gato04.gif" id="gato4">
            <p id="textoGato4">lá lá lá lá lá lá</p>
        </div>

        <div class="coluna">
            <img src="Imagens/gato05.gif" id="gato5">
            <p><button id="btnSorte">Gerar número da sorte</button></p>
            <input type="text" id="numeroSorte">
        </div>

    </div>

</body>
</html>
