<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Exercício 07</title>

    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>

<body>

    <form>

        <table>

            <tr>
                <td colspan="3">
                    <h2>Acesso ao Sistema</h2>
                </td>
            </tr>

            <tr>
                <td>
                    <label>Login</label>
                </td>

                <td colspan="2">
                    <input type="text" id="login">
                </td>
            </tr>

            <tr>
                <td>
                    <label>Senha</label>
                </td>

                <td>
                    <input type="password" id="senha">
                </td>

                <td>
                    <span class="aviso">(max. 8 caracteres)</span>
                </td>
            </tr>

            <tr>
                <td>
                    <label>Confirmar Senha</label>
                </td>

                <td>
                    <input type="password" id="confirmarSenha">
                </td>

                <td>
                    <span class="aviso">(max. 8 caracteres)</span>
                </td>
            </tr>

            <tr>
                <td colspan="3">
                    <input type="button" value="Entrar" id="btnEntrar">
                    <input type="button" value="Limpar" id="btnLimpar">
                </td>
            </tr>

        </table>

    </form>

</body>

</html>
